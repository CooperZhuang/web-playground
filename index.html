<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-playground · 个人小网站合集</title>
  <style>
    :root {
      --bg: #0e1116;
      --surface: #161b22;
      --surface-hover: #1c232c;
      --border: #262d38;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-2: #3fb950;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #16202c 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8vh 24px 48px;
    }

    header {
      max-width: 760px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 960px;
      margin-top: 48px;
    }

    a.card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    a.card:hover,
    a.card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: var(--surface-hover);
      outline: none;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      flex: 1;
    }

    .tag {
      align-self: flex-start;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--accent-2);
      border: 1px solid rgba(63, 185, 80, 0.35);
      border-radius: 999px;
      padding: 2px 9px;
    }

    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.8;
    }

    footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer a:hover {
      color: var(--text);
    }
  </style>
</head>

<body>
  <header>
    <h1>web-playground</h1>
    <p class="subtitle">
      个人娱乐时写的小网站合集。纯静态 HTML，零依赖、零构建，双击就能玩。
    </p>
  </header>

  <main class="cards">
    <a class="card" href="./annual-lottery/">
      <span class="tag">工具</span>
      <span class="card-title">年会抽奖</span>
      <span class="card-desc">贴名单、配奖项，点一下开始滚动，再点一下定格中奖人。记录存在浏览器本地。</span>
    </a>

    <a class="card" href="./sardine-boids/">
      <span class="tag">模拟</span>
      <span class="card-title">沙丁鱼群 2D</span>
      <span class="card-desc">一屏沙丁鱼按 boids 规则游动：合群、对齐、避让，顺带躲开捕食者。</span>
    </a>

    <a class="card" href="./sardine-boids-3d/">
      <span class="tag">模拟</span>
      <span class="card-title">沙丁鱼群 3D</span>
      <span class="card-desc">3D 版鱼群加虎鲸捕食者，可以围观鱼群被冲散、谁被吃掉。</span>
    </a>
  </main>

  <footer>
    玩票作品，代码风格随意。<br>
    旧版抽奖页存档在 <a href="./archive/annual-lottery-v1.html">archive/annual-lottery-v1.html</a>
  </footer>
</body>

</html>

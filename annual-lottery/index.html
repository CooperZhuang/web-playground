<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年会抽奖系统</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --secondary-color: #FFC107;
      --background-color: #121212;
      --text-color: #E0E0E0;
      --card-background: #282828;
      --border-radius: 8px;
      --box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 95%;
      max-width: 1400px;
      height: 90vh;
      background: var(--background-color);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      overflow: hidden;
    }

    .config-panel,
    .lottery-panel {
      padding: 2rem;
      box-sizing: border-box;
      overflow-y: auto;
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE and Edge */
    }

    .config-panel::-webkit-scrollbar,
    .lottery-panel::-webkit-scrollbar {
      display: none;
      /* Chrome, Safari, Opera */
    }

    .config-panel {
      width: 35%;
      background: var(--card-background);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lottery-panel {
      width: 65%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    h1,
    h2 {
      text-align: center;
      color: var(--primary-color);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      margin-top: 0;
    }

    h1 {
      font-size: 2.5rem;
    }

    h2 {
      font-size: 1.8rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      color: var(--text-color);
    }

    textarea,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.8rem;
      background: #444;
      border: 1px solid #555;
      border-radius: var(--border-radius);
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: var(--background-color);
    }

    .btn-primary:hover {
      background-color: #66BB6A;
    }

    .btn-secondary {
      background-color: var(--secondary-color);
      color: var(--background-color);
    }

    .btn-secondary:hover {
      background-color: #FFD54F;
    }

    .btn-danger {
      background-color: #F44336;
      color: white;
    }

    .btn-danger:hover {
      background-color: #E57373;
    }

    .prize-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .prize-item input {
      flex: 1;
    }

    .lottery-area {
      position: relative;
      width: 90%;
      height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--border-radius);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
      margin-top: 2rem;
      overflow: hidden;
    }

    #current-winner {
      font-size: 4rem;
      font-weight: bold;
      color: var(--secondary-color);
      text-shadow: 0 0 15px var(--secondary-color);
      animation: pulse 1.5s infinite;
      z-index: 10;
      display: none;
      /* Initially hidden */
    }

    #roll-name {
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
      display: none;
      position: absolute;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .fireworks {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--secondary-color) 0%, transparent 70%);
      opacity: 0;
      animation: fireworks-blast 1.5s ease-out forwards;
    }

    @keyframes fireworks-blast {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }

    .lottery-controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      margin-top: 1rem;
    }

    .winner-list {
      width: 90%;
      margin-top: 1rem;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
    }

    .winner-list h3 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--secondary-color);
    }

    .winner-item {
      background: #333;
      padding: 0.8rem;
      margin-bottom: 0.5rem;
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .winner-item span:first-child {
      color: white;
      font-weight: bold;
    }

    .winner-item span:last-child {
      color: var(--secondary-color);
      font-size: 0.9rem;
    }

    .config-footer {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="config-panel">
      <h1>抽奖设置</h1>

      <div class="input-group">
        <label for="participant-list">参与抽奖名单 (每行一个姓名)</label>
        <textarea id="participant-list" rows="10"></textarea>
      </div>

      <div class="input-group">
        <label>奖项设置</label>
        <div id="prizes-container"></div>
        <button onclick="addPrizeInput()" class="btn-primary" style="width: 100%;">添加奖项</button>
      </div>

      <div class="input-group">
        <input type="checkbox" id="allow-duplicate" style="width: auto;">
        <label for="allow-duplicate" style="display: inline;">允许重复中奖</label>
      </div>

      <div class="config-footer">
        <button onclick="saveConfiguration()" class="btn-primary" style="width: 100%;">保存配置</button>
        <button onclick="clearAllData()" class="btn-danger" style="width: 100%; margin-top: 1rem;">一键清除历史数据</button>
      </div>
    </div>

    <div class="lottery-panel">
      <h1>年会抽奖</h1>

      <div class="lottery-area">
        <div id="roll-name"></div>
        <div id="current-winner"></div>
      </div>

      <div class="lottery-controls">
        <div class="input-group" style="width: 100%; max-width: 400px;">
          <label for="prize-select">选择当前奖项</label>
          <select id="prize-select" style="width: 100%;"></select>
        </div>
        <button onclick="startLottery()" id="start-btn" class="btn-secondary"
          style="width: 100%; max-width: 400px;">开始抽奖</button>
      </div>

      <div class="winner-list">
        <h3>中奖记录</h3>
        <div id="winner-records"></div>
      </div>
    </div>
  </div>

  <script>
    const participantListEl = document.getElementById('participant-list');
    const prizesContainerEl = document.getElementById('prizes-container');
    const allowDuplicateEl = document.getElementById('allow-duplicate');
    const prizeSelectEl = document.getElementById('prize-select');
    const rollNameEl = document.getElementById('roll-name');
    const currentWinnerEl = document.getElementById('current-winner');
    const startBtnEl = document.getElementById('start-btn');
    const winnerRecordsEl = document.getElementById('winner-records');

    let participants = [];
    let prizes = [];
    let winners = [];
    let currentPrizeIndex = -1;
    let isDrawing = false;
    let rollInterval;

    // --- 数据存储与加载 ---
    function loadData() {
      const storedParticipants = localStorage.getItem('participants');
      const storedPrizes = localStorage.getItem('prizes');
      const storedWinners = localStorage.getItem('winners');
      const storedAllowDuplicate = localStorage.getItem('allow-duplicate');

      if (storedParticipants) {
        participants = JSON.parse(storedParticipants);
        participantListEl.value = participants.join('\n');
      }
      if (storedPrizes) {
        prizes = JSON.parse(storedPrizes);
        renderPrizes();
        renderPrizeSelect();
      }
      if (storedWinners) {
        winners = JSON.parse(storedWinners);
        renderWinnerRecords();
      }
      if (storedAllowDuplicate) {
        allowDuplicateEl.checked = JSON.parse(storedAllowDuplicate);
      }
    }

    function saveData() {
      localStorage.setItem('participants', JSON.stringify(participants));
      localStorage.setItem('prizes', JSON.stringify(prizes));
      localStorage.setItem('winners', JSON.stringify(winners));
      localStorage.setItem('allow-duplicate', JSON.stringify(allowDuplicateEl.checked));
    }

    // --- 配置面板功能 ---
    function addPrizeInput(name = '', quantity = 1) {
      const prizeItem = document.createElement('div');
      prizeItem.className = 'prize-item';
      prizeItem.innerHTML = `
            <input type="text" value="${name}" placeholder="奖项名称 (如：一等奖)">
            <input type="number" value="${quantity}" min="1" placeholder="数量" style="width: 80px;">
            <button onclick="removePrizeInput(this)" class="btn-danger">删除</button>
        `;
      prizesContainerEl.appendChild(prizeItem);
    }

    function removePrizeInput(button) {
      button.closest('.prize-item').remove();
    }

    function saveConfiguration() {
      // 保存参与者名单
      const names = participantListEl.value.split('\n').filter(n => n.trim() !== '');
      participants = names;

      // 保存奖项配置
      prizes = [];
      document.querySelectorAll('.prize-item').forEach((item, index) => {
        const name = item.querySelector('input[type="text"]').value;
        const quantity = parseInt(item.querySelector('input[type="number"]').value);
        prizes.push({
          id: index,
          name: name || `奖项 ${index + 1}`,
          quantity: quantity > 0 ? quantity : 1,
          winners: []
        });
      });

      saveData();
      renderPrizeSelect();
      alert('配置已保存！');
    }

    function clearAllData() {
      if (confirm('确定要清除所有历史数据吗？此操作不可逆！')) {
        localStorage.clear();
        window.location.reload();
      }
    }

    function renderPrizes() {
      prizesContainerEl.innerHTML = '';
      if (prizes.length === 0) {
        addPrizeInput();
      } else {
        prizes.forEach(p => addPrizeInput(p.name, p.quantity));
      }
    }

    function renderPrizeSelect() {
      prizeSelectEl.innerHTML = '';
      prizes.forEach((p, index) => {
        const option = document.createElement('option');
        const remaining = p.quantity - p.winners.length;
        option.value = index;
        option.textContent = `${p.name} (剩余: ${remaining})`;
        option.disabled = remaining <= 0;
        prizeSelectEl.appendChild(option);
      });
      currentPrizeIndex = prizeSelectEl.value !== '' ? parseInt(prizeSelectEl.value) : -1;
    }

    // --- 抽奖核心逻辑 ---
    function startLottery() {
      if (isDrawing) {
        stopLottery();
        return;
      }

      currentPrizeIndex = parseInt(prizeSelectEl.value);
      if (currentPrizeIndex === -1 || participants.length === 0) {
        alert('请先配置奖项和参与者名单！');
        return;
      }

      isDrawing = true;
      startBtnEl.textContent = '停止抽奖';

      currentWinnerEl.style.display = 'none';
      rollNameEl.style.display = 'block';

      const availableParticipants = getAvailableParticipants();
      if (availableParticipants.length === 0) {
        alert('没有可用的参与者了！');
        isDrawing = false;
        startBtnEl.textContent = '开始抽奖';
        return;
      }

      rollInterval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * availableParticipants.length);
        rollNameEl.textContent = availableParticipants[randomIndex];
      }, 50);
    }

    function stopLottery() {
      clearInterval(rollInterval);
      isDrawing = false;
      startBtnEl.textContent = '开始抽奖';

      const availableParticipants = getAvailableParticipants();
      const winnerName = availableParticipants[Math.floor(Math.random() * availableParticipants.length)];

      // 更新中奖记录
      const currentPrize = prizes[currentPrizeIndex];
      currentPrize.winners.push(winnerName);
      winners.push({ name: winnerName, prize: currentPrize.name });
      saveData();

      // 渲染结果
      rollNameEl.style.display = 'none';
      currentWinnerEl.textContent = winnerName;
      currentWinnerEl.style.display = 'block';

      // 酷炫效果：粒子动画
      createFireworks();
      renderWinnerRecords();
      renderPrizeSelect();
    }

    function getAvailableParticipants() {
      if (allowDuplicateEl.checked) {
        return participants;
      } else {
        const allWinners = winners.map(w => w.name);
        return participants.filter(p => !allWinners.includes(p));
      }
    }

    // --- 视觉效果 ---
    function createFireworks() {
      const lotteryArea = document.querySelector('.lottery-area');
      for (let i = 0; i < 5; i++) {
        const firework = document.createElement('div');
        firework.className = 'fireworks';
        firework.style.top = `${50 + Math.random() * 40 - 20}%`;
        firework.style.left = `${50 + Math.random() * 40 - 20}%`;
        firework.style.animationDelay = `${i * 0.1}s`;
        lotteryArea.appendChild(firework);
        firework.addEventListener('animationend', () => {
          firework.remove();
        });
      }
    }

    function renderWinnerRecords() {
      winnerRecordsEl.innerHTML = '';
      winners.forEach(w => {
        const item = document.createElement('div');
        item.className = 'winner-item';
        item.innerHTML = `
                <span>${w.name}</span>
                <span>${w.prize}</span>
            `;
        winnerRecordsEl.appendChild(item);
      });
    }

    // --- 页面加载时执行 ---
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
    });
  </script>

</body>

</html>
